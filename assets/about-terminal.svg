<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Animated developer profile terminal card">
  <title>Animated developer profile terminal card</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#22c55e"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset=".65" stop-color="#7c3aed" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipLine1"><rect x="78" y="100" height="30" width="0"><animate attributeName="width" values="0;750;750" dur="3.6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipLine2"><rect x="78" y="145" height="30" width="0"><animate attributeName="width" values="0;0;680;680" keyTimes="0;.22;.75;1" dur="4.2s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clipLine3"><rect x="78" y="190" height="30" width="0"><animate attributeName="width" values="0;0;735;735" keyTimes="0;.35;.82;1" dur="4.8s" repeatCount="indefinite"/></rect></clipPath>
    <style><![CDATA[
      .window { fill: #0d1117; stroke: url(#border); stroke-width: 2.5; }
      .bar { fill: #111827; opacity: .92; }
      .muted { fill: #94a3b8; font: 500 16px 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .code { font: 600 23px 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      .green { fill: #22c55e; }
      .blue { fill: #38bdf8; }
      .orange { fill: #f97316; }
      .purple { fill: #a78bfa; }
      .white { fill: #e5e7eb; }
      .chipText { fill: #e5e7eb; font: 700 15px 'Inter', Arial, sans-serif; }
      .chip { fill: #111827; stroke: #233044; stroke-width: 1.2; }
      .dash { stroke-dasharray: 34 18; animation: dash 6s linear infinite; }
      .float { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5.2s ease-in-out infinite reverse; }
      @keyframes dash { to { stroke-dashoffset: -500; } }
      @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    ]]></style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#0d1117"/>
  <circle cx="985" cy="84" r="115" fill="url(#orb)" opacity=".65"/>
  <circle cx="1085" cy="315" r="85" fill="url(#orb)" opacity=".35"/>
  <rect x="14" y="14" width="1172" height="392" rx="24" class="window"/>
  <rect x="16" y="16" width="1168" height="58" rx="22" class="bar"/>
  <circle cx="48" cy="45" r="8" fill="#ef4444"/>
  <circle cx="76" cy="45" r="8" fill="#f59e0b"/>
  <circle cx="104" cy="45" r="8" fill="#22c55e"/>
  <text x="138" y="51" class="muted">developer@oussama:~/profile</text>
  <text x="1010" y="51" class="muted">status: building</text>

  <g opacity=".22" filter="url(#glow)">
    <path d="M860 120 H1110 M895 160 H1145 M925 200 H1080 M880 240 H1130" stroke="#38bdf8" stroke-width="2" class="dash"/>
    <circle class="float" cx="1065" cy="115" r="5" fill="#38bdf8"/>
    <circle class="float2" cx="1120" cy="220" r="4" fill="#f97316"/>
    <circle class="float" cx="995" cy="265" r="4" fill="#a78bfa"/>
  </g>

  <g opacity="0.58">
    <text x="78" y="124" class="code green">const</text>
    <text x="150" y="124" class="code blue">Oussama</text>
    <text x="268" y="124" class="code white">= { role:</text>
    <text x="430" y="124" class="code orange">"Full-Stack Developer"</text>
    <text x="742" y="124" class="code white"> };</text>
    <text x="78" y="169" class="code purple">stack</text>
    <text x="158" y="169" class="code white">:</text>
    <text x="188" y="169" class="code orange">["DRF", "React", "PostgreSQL", "Laravel"]</text>
    <text x="774" y="169" class="code white">;</text>
    <text x="78" y="214" class="code purple">mission</text>
    <text x="185" y="214" class="code white">:</text>
    <text x="215" y="214" class="code orange">"Build useful, secure and scalable apps"</text>
    <text x="760" y="214" class="code white">;</text>
  </g>

  <g clip-path="url(#clipLine1)">
    <text x="78" y="124" class="code green">const</text>
    <text x="150" y="124" class="code blue">Oussama</text>
    <text x="268" y="124" class="code white">= { role:</text>
    <text x="430" y="124" class="code orange">"Full-Stack Developer"</text>
    <text x="742" y="124" class="code white"> };</text>
  </g>
  <g clip-path="url(#clipLine2)">
    <text x="78" y="169" class="code purple">stack</text>
    <text x="158" y="169" class="code white">:</text>
    <text x="188" y="169" class="code orange">["DRF", "React", "PostgreSQL", "Laravel"]</text>
    <text x="774" y="169" class="code white">;</text>
  </g>
  <g clip-path="url(#clipLine3)">
    <text x="78" y="214" class="code purple">mission</text>
    <text x="185" y="214" class="code white">:</text>
    <text x="215" y="214" class="code orange">"Build useful, secure and scalable apps"</text>
    <text x="760" y="214" class="code white">;</text>
  </g>

  <rect x="78" y="248" width="260" height="46" rx="14" class="chip"/>
  <text x="102" y="277" class="chipText">LOC Tangier, Morocco</text>
  <rect x="356" y="248" width="245" height="46" rx="14" class="chip"/>
  <text x="380" y="277" class="chipText">EDU FST Tanger</text>
  <rect x="619" y="248" width="300" height="46" rx="14" class="chip"/>
  <text x="643" y="277" class="chipText">AI web apps + APIs</text>
  <rect x="78" y="318" width="460" height="46" rx="14" fill="#111827" stroke="url(#accent)" stroke-width="1.6"/>
  <text x="105" y="348" class="chipText">Lead Developer: DRF / React / PostgreSQL</text>
  <rect x="560" y="318" width="438" height="46" rx="14" fill="#111827" stroke="url(#accent)" stroke-width="1.6"/>
  <text x="587" y="348" class="chipText">RBAC • Realtime notifications • Dashboards</text>

  <rect x="1055" y="320" width="10" height="34" rx="3" fill="#f97316" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
