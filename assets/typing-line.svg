<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Animated typing line">
  <title>Animated typing line</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f97316"/>
      <animate attributeName="x1" values="-1;0;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typeClip">
      <rect x="110" y="0" height="110" width="0">
        <animate attributeName="width" values="0;980;980;0;0" keyTimes="0;0.55;0.8;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style><![CDATA[
      .bg { fill: #0d1117; opacity: .0; }
      .text { font: 700 34px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: url(#g); filter: url(#glow); }
      .sub { font: 500 17px 'Inter', Arial, sans-serif; fill: #94a3b8; letter-spacing: .8px; }
      .cursor { fill: #f97316; filter: url(#glow); }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    ]]></style>
  </defs>
  <rect class="bg" width="1200" height="110"/>
  <text x="600" y="26" text-anchor="middle" class="sub">FULL-STACK SOFTWARE ENGINEERING PORTFOLIO</text>
  <text x="110" y="74" class="text" opacity="0.22">OUSSAMA EL BOUALITI</text>
  <g clip-path="url(#typeClip)">
    <text x="110" y="74" class="text">OUSSAMA EL BOUALITI</text>
  </g>
  <rect class="cursor" x="110" y="43" width="14" height="40" rx="3">
    <animate attributeName="x" values="110;1090;1090;110;110" keyTimes="0;0.55;0.8;0.92;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
